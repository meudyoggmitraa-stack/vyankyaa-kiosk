<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --green: #0C4824;
    --green-dark: #082f18;
    --green-light: #14602f;
    --red: #FB0200;
    --red-dark: #c50000;
    --cream: #F7F4EC;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow-x: hidden;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- HEADER ---------- */
  header {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    padding: 16px 16px 22px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
  }
  .logo-plate {
    background: #fff; border-radius: 16px; padding: 10px 16px;
    display: inline-block; box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    max-width: 280px; width: 72%;
  }
  .logo-plate img { width: 100%; height: auto; display: block; }
  .greeting {
    color: #fff; font-size: 15px; font-weight: 600; margin-top: 14px;
    opacity: 0.95; letter-spacing: 0.2px;
  }
  .greeting .wave { display: inline-block; }
  .status-row {
    display: flex; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap;
  }
  .chip {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px;
    background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; gap: 5px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #f5c518; }
  .chip.ok .dot { background: #4ade80; }
  .chip.bad .dot { background: #f87171; }

  /* ---------- CLOCK STRIP ---------- */
  .clock-strip { text-align: center; padding: 14px 10px 6px; }
  #clock { font-size: 40px; font-weight: 700; color: var(--green-dark); letter-spacing: 1px; }
  #dateline { font-size: 14px; color: #667; margin-top: 2px; }

  main { flex: 1; padding: 10px 16px 30px; max-width: 480px; margin: 0 auto; width: 100%; }

  .card {
    background: #fff; border-radius: 18px; padding: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08); margin-top: 10px;
  }
  h2.section-title {
    text-align: center; font-size: 17px; color: var(--green-dark); margin: 4px 0 16px;
    font-weight: 700;
  }

  /* ---------- STEP 1: EMPLOYEE GRID ---------- */
  #employeeGrid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .emp-card {
    background: var(--cream); border: 2px solid transparent; border-radius: 14px;
    padding: 16px 8px; text-align: center; cursor: pointer; transition: transform .12s, border-color .12s;
  }
  .emp-card:active { transform: scale(0.96); border-color: var(--red); }
  .emp-avatar {
    width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #fff;
  }
  .emp-name { font-size: 14px; font-weight: 600; color: var(--ink); }

  /* ---------- STEP 2: CAMERA ---------- */
  .cam-wrap {
    position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 16px; overflow: hidden;
    background: #000;
  }
  .cam-wrap video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .face-guide {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 56%; height: 76%; border: 3px dashed rgba(255,255,255,0.75);
    border-radius: 50% / 45%; pointer-events: none;
  }
  .selected-name-banner {
    text-align: center; font-weight: 700; color: var(--green-dark); margin-bottom: 10px; font-size: 16px;
  }
  .shutter-row { display: flex; justify-content: center; margin-top: 18px; }
  .shutter-btn {
    width: 74px; height: 74px; border-radius: 50%; background: var(--red);
    border: 5px solid #fff; box-shadow: 0 0 0 3px var(--red); cursor: pointer;
  }
  .shutter-btn:active { transform: scale(0.94); }
  .back-link {
    text-align: center; margin-top: 14px; font-size: 14px; color: #888; cursor: pointer;
  }

  /* ---------- STEP 3: PREVIEW + ACTIONS ---------- */
  #previewImg {
    width: 100%; border-radius: 16px; display: block; transform: scaleX(-1);
  }
  .action-row { display: flex; gap: 12px; margin-top: 16px; }
  .action-btn {
    flex: 1; padding: 18px 10px; border: none; border-radius: 14px; font-size: 17px;
    font-weight: 700; color: #fff; cursor: pointer;
  }
  .action-btn.checkin { background: var(--green); }
  .action-btn.checkout { background: var(--red); }
  .action-btn:disabled { opacity: 0.5; }
  .retake-btn {
    display: block; margin: 12px auto 0; background: none; border: none;
    color: #888; font-size: 14px; text-decoration: underline; cursor: pointer;
  }

  /* ---------- OVERLAY: PROCESSING / RESULT ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(8,47,24,0.94); color: #fff;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 30px; z-index: 50;
  }
  #overlay.show { display: flex; }
  .spinner {
    width: 54px; height: 54px; border: 5px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlayMsg { font-size: 18px; font-weight: 600; max-width: 320px; line-height: 1.5; }
  #overlaySub { font-size: 13px; opacity: 0.75; margin-top: 8px; }
  .overlay-icon { font-size: 52px; margin-bottom: 14px; }
  .overlay-btn {
    margin-top: 22px; background: #fff; color: var(--green-dark); border: none;
    padding: 12px 26px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: none;
  }

  footer { text-align: center; font-size: 11px; color: #99a; padding: 10px; }
</style>
</head>

      <div class="chip" id="locChip"><span class="dot"></span><span id="locChipText">Locating…</span></div>

  <main>

    <!-- STEP 1 -->
    <div class="card" id="step1">
      <h2 class="section-title">Tap your name to continue</h2>
      <div id="employeeGrid"></div>
    </div>

    <!-- STEP 2 -->
    <div class="card" id="step2" style="display:none;">
      <div class="selected-name-banner" id="camName"></div>
      <div class="cam-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="face-guide"></div>
      </div>
      <div class="shutter-row">
        <button class="shutter-btn" id="shutterBtn" aria-label="Capture"></button>
      </div>
      <div class="back-link" id="backToGrid">&larr; Not you? Choose again</div>

    <div class="card" id="step3" style="display:none;">

  <div id="overlaySpinner" class="spinner"></div>
  <div id="overlayIcon" class="overlay-icon" style="display:none;"></div>
  <div id="overlayMsg">Verifying &amp; uploading…</div>
  <div id="overlaySub">Please wait, don't close this screen.</div>
  <button class="overlay-btn" id="overlayRetryBtn">Try Again</button>
</div>

<script>
  // ============================================================
  // PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL BELOW
  // (Deploy > Manage deployments > copy the URL ending in /exec)
  // ============================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQArjwDJB5fsnSuyMAAU1ZXqbFImZ8n5WQ1MTAv2_f3v1Dh6651xzI7mvQ-z3TYCRq/exec';

  function apiCall(payload) {
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      // Sent as text/plain on purpose -- this avoids a CORS "preflight"
      // request, which Apps Script's web app endpoint can't handle.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(r) { return r.json(); });
  }

  // ---------------- STATE ----------------
  let employees = [];
  let currentEmployee = '';
  let stream = null;
  let clientIp = '';
  let lastLat = null, lastLng = null, lastAccuracy = null;
  let lastPhotoBase64 = '';
  let pendingPayload = null;
  let overlayTimeoutHandle = null;

  const AVATAR_COLORS = ['#0C4824', '#FB0200', '#14602f', '#c50000', '#0C4824', '#FB0200'];

  // ---------------- CLOCK ----------------
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString();
    document.getElementById('dateline').textContent = now.toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }
  setInterval(tick, 1000);
  tick();

  // ---------------- GREETING ----------------
  function timeGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'Good Morning';
    if (h < 17) return 'Good Afternoon';
    return 'Good Evening';
  }
  function setGreeting() {
    document.getElementById('greetingText').innerHTML =
      '<span class="wave">👋</span> ' + timeGreeting() + '! Have a great day at work.';
  }
  setGreeting();
  setInterval(setGreeting, 60000);

  // ---------------- CONFIG / EMPLOYEE GRID ----------------
  apiCall({ action: 'getConfig' }).then(function(res) {
    const config = res.config || {};
    employees = config.employees || [];
    renderGrid();
  }).catch(function(err) {
    console.error('Could not load employee list:', err);
  });

  function initials(name) {
    return name.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();
  }

  function renderGrid() {
    const grid = document.getElementById('employeeGrid');
    grid.innerHTML = '';
    employees.forEach((name, idx) => {
      const div = document.createElement('div');
      div.className = 'emp-card';
      div.innerHTML = '<div class="emp-avatar" style="background:' + AVATAR_COLORS[idx % AVATAR_COLORS.length] +
        '">' + initials(name) + '</div><div class="emp-name">' + name + '</div>';
      div.onclick = function() { selectEmployee(name); };
      grid.appendChild(div);
    });
  }

  function selectEmployee(name) {
    currentEmployee = name;
    document.getElementById('camName').textContent = timeGreeting() + ', ' + name.split(' ')[0] + '!';
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('step3').style.display = 'none';
    startCameraPreview();
  }

  document.getElementById('backToGrid').onclick = function() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
  };

  // ---------------- CLIENT IP (used only if OfficeIPs is configured) ----------------
  fetch('https://api.ipify.org?format=json')
    .then(r => r.json()).then(d => clientIp = d.ip).catch(() => clientIp = '');

  // ---------------- GEOLOCATION ----------------
  function setLocChip(state, text) {
    const chip = document.getElementById('locChip');
    chip.className = 'chip' + (state ? ' ' + state : '');
    document.getElementById('locChipText').textContent = text;
  }

  function startGeoWatch() {
    if (!navigator.geolocation) {
      setLocChip('bad', 'No GPS support');
      return;
    }
    setLocChip('', 'Locating…');
    navigator.geolocation.watchPosition(function(pos) {
      lastLat = pos.coords.latitude;
      lastLng = pos.coords.longitude;
      lastAccuracy = Math.round(pos.coords.accuracy);
      setLocChip('ok', 'Location ready (±' + lastAccuracy + 'm)');
    }, function(err) {
      setLocChip('bad', 'Location denied');
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  }
  startGeoWatch();

  // ---------------- CAMERA ----------------
  function setCamChip(state, text) {
    const chip = document.getElementById('camChip');
    chip.className = 'chip' + (state ? ' ' + state : '');
    document.getElementById('camChipText').textContent = text;
  }

  function initCameraEarly() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setCamChip('bad', 'No camera support');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false })
      .then(function(s) {
        stream = s;
        setCamChip('ok', 'Camera ready');
      })
      .catch(function() {
        setCamChip('bad', 'Camera denied');
      });
  }
  initCameraEarly();

  function startCameraPreview() {
    const video = document.getElementById('video');
    if (stream) {
      video.srcObject = stream;
    } else {
      initCameraEarly();
      setTimeout(function() { if (stream) video.srcObject = stream; }, 800);
    }
  }

  document.getElementById('shutterBtn').onclick = function() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const targetW = 480, targetH = 360;
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    // mirror to match the preview the user sees
    ctx.translate(targetW, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, targetW, targetH);
    lastPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);

    document.getElementById('previewImg').src = lastPhotoBase64;
    document.getElementById('previewName').textContent = 'Looking good, ' + currentEmployee.split(' ')[0] + '! Confirm below.';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'block';
  };

  document.getElementById('retakeBtn').onclick = function() {
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
  };

  // ---------------- SUBMIT ----------------
  function showOverlay(mode, msg, sub) {
    const overlay = document.getElementById('overlay');
    const spinner = document.getElementById('overlaySpinner');
    const icon = document.getElementById('overlayIcon');
    const retryBtn = document.getElementById('overlayRetryBtn');
    overlay.classList.add('show');
    document.getElementById('overlayMsg').textContent = msg;
    document.getElementById('overlaySub').textContent = sub || '';
    if (mode === 'loading') {
      spinner.style.display = 'block'; icon.style.display = 'none'; retryBtn.style.display = 'none';
    } else {
      spinner.style.display = 'none'; icon.style.display = 'block'; retryBtn.style.display = 'none';
      icon.textContent = mode === 'success' ? '✅' : '⚠️';
    }
  }
  function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }

  function submitAttendance(action) {
    if (!lastPhotoBase64) { return; }
    pendingPayload = {
      employee: currentEmployee,
      action: action,
      clientIp: clientIp,
      lat: lastLat,
      lng: lastLng,
      accuracy: lastAccuracy,
      photoBase64: lastPhotoBase64
    };
    doSubmit();
  }

  function doSubmit() {
    showOverlay('loading', 'Verifying location & uploading selfie…', 'This can take a few seconds on slow WiFi.');

    // If it hangs (common failure point on slow office WiFi / large payload),
    // offer a manual retry instead of leaving the kiosk stuck forever.
    clearTimeout(overlayTimeoutHandle);
    overlayTimeoutHandle = setTimeout(function() {
      document.getElementById('overlaySub').textContent = 'Taking longer than usual — you can wait, or tap Retry.';
      document.getElementById('overlayRetryBtn').style.display = 'inline-block';
    }, 15000);

    apiCall(pendingPayload)
      .then(function(res) {
        clearTimeout(overlayTimeoutHandle);
        if (res.success) {
          showOverlay('success', res.message, 'Returning to start…');
          setTimeout(resetToStart, 3500);
        } else {
          showOverlay('error', res.message, 'Tap anywhere to try again.');
          document.getElementById('overlay').onclick = function() {
            document.getElementById('overlay').onclick = null;
            hideOverlay();
          };
        }
      })
      .catch(function(err) {
        clearTimeout(overlayTimeoutHandle);
        document.getElementById('overlaySub').textContent = 'Connection issue — tap Retry.';
        document.getElementById('overlayRetryBtn').style.display = 'inline-block';
        showOverlay('error', 'Could not reach the server: ' + err.message, '');
        document.getElementById('overlayRetryBtn').style.display = 'inline-block';
      });
  }

  document.getElementById('overlayRetryBtn').onclick = function() {
    document.getElementById('overlayRetryBtn').style.display = 'none';
    doSubmit();
  };

  document.getElementById('btnCheckin').onclick = function() { submitAttendance('checkin'); };
  document.getElementById('btnCheckout').onclick = function() { submitAttendance('checkout'); };

  function resetToStart() {
    hideOverlay();
    lastPhotoBase64 = '';
    currentEmployee = '';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
  }
</script>
</body>
</html>
